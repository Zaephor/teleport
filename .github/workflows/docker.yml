name: "Docker Images"

on:
  workflow_call:
    inputs:
      tp_version:
        description: "Teleport version tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tp_version:
        description: "Teleport version tag (e.g. v18.7.2)"
        required: true

permissions:
  contents: read
  packages: write    # needed for GHCR push

jobs:
  docker-official:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4
        with:
          ref: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Determine tags
        id: vars
        run: |
          LATEST=$(cat LATEST)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Identify available platforms
        id: plat
        run: |
          ARCHES=""
          for mapping in 'amd64,linux/amd64' 'armhf,linux/arm/v7' 'arm64,linux/arm64/v8'; do
            ARCH_NAME="${mapping%,*}"
            DOCKER_PLAT="${mapping#*,}"
            STATUS=$(curl -sI --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tp_version }}/teleport-${{ inputs.tp_version }}-linux-${ARCH_NAME}.tar.gz")
            if [[ "${STATUS}" == "200" || "${STATUS}" == "302" ]]; then
              if [[ -n "${ARCHES}" ]]; then ARCHES+=","; fi
              ARCHES+="${DOCKER_PLAT}"
            fi
          done
          echo "platforms=${ARCHES}" >> "$GITHUB_OUTPUT"
          echo "Available platforms: ${ARCHES}"

      - name: Set up QEMU
        if: steps.plat.outputs.platforms != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.plat.outputs.platforms != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.plat.outputs.platforms != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.plat.outputs.platforms != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (official)
        id: meta
        if: steps.plat.outputs.platforms != ''
        uses: docker/metadata-action@v5
        with:
          images: |
            draconrose/teleport
            ghcr.io/${{ github.repository_owner }}/teleport
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},value=${{ inputs.tp_version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.tp_version }}
            type=semver,pattern=v{{major}},value=${{ inputs.tp_version }}
            type=raw,value=latest,enable=${{ inputs.tp_version == steps.vars.outputs.latest }}

      - name: Build and push (official)
        if: steps.plat.outputs.platforms != ''
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.official
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE=${{ inputs.tp_version }}
            GITHUB_REPO=${{ github.repository }}

  docker-lsio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4
        with:
          ref: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Determine tags
        id: vars
        run: |
          LATEST=$(cat LATEST)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Identify available platforms
        id: plat
        run: |
          ARCHES=""
          for mapping in 'amd64,linux/amd64' 'armhf,linux/arm/v7' 'arm64,linux/arm64/v8'; do
            ARCH_NAME="${mapping%,*}"
            DOCKER_PLAT="${mapping#*,}"
            STATUS=$(curl -sI --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tp_version }}/teleport-${{ inputs.tp_version }}-linux-${ARCH_NAME}.tar.gz")
            if [[ "${STATUS}" == "200" || "${STATUS}" == "302" ]]; then
              if [[ -n "${ARCHES}" ]]; then ARCHES+=","; fi
              ARCHES+="${DOCKER_PLAT}"
            fi
          done
          echo "platforms=${ARCHES}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.plat.outputs.platforms != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.plat.outputs.platforms != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.plat.outputs.platforms != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.plat.outputs.platforms != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (LSIO)
        id: meta
        if: steps.plat.outputs.platforms != ''
        uses: docker/metadata-action@v5
        with:
          images: |
            draconrose/teleport-lsio
            ghcr.io/${{ github.repository_owner }}/teleport-lsio
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},value=${{ inputs.tp_version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.tp_version }}
            type=semver,pattern=v{{major}},value=${{ inputs.tp_version }}
            type=raw,value=latest,enable=${{ inputs.tp_version == steps.vars.outputs.latest }}

      - name: Build and push (LSIO)
        if: steps.plat.outputs.platforms != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.lsio
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE=${{ inputs.tp_version }}
            GITHUB_REPO=${{ github.repository }}
