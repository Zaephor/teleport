name: "Build Era 4 (v4.1-v4.2)"

on:
  workflow_call:
    inputs:
      tp_version:
        description: "Teleport version tag (e.g. v4.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tp_version:
        description: "Teleport version tag (e.g. v4.0.0)"
        required: true
        default: "v4.2.13"

permissions:
  contents: write    # needed for release creation
  packages: write    # needed by docker.yml for GHCR push
  actions: read      # needed for cache

env:
  UPSTREAM: github.com/gravitational/teleport

jobs:
  build-core:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-lite
            go_os: linux
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-arm64-lite
            go_os: linux
            go_arch: arm64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:20.04
            pam: "true"
            cc: aarch64-linux-gnu-gcc
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-amd64-upstream
            go_os: linux
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "upstream"
          - name: linux-arm64-upstream
            go_os: linux
            go_arch: arm64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:20.04
            pam: "true"
            cc: aarch64-linux-gnu-gcc
            runner: ubuntu-latest
            build_variant: "upstream"

    steps:
      - name: Configure Docker Hub mirror
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Cache build container
        if: runner.os == 'Linux' && matrix.build_container != ''
        id: container-cache
        uses: actions/cache@v4
        with:
          path: /tmp/container-image.tar
          key: container-${{ matrix.build_container }}

      - name: Load or pull build container
        if: runner.os == 'Linux' && matrix.build_container != ''
        run: |
          if [[ -f /tmp/container-image.tar ]]; then
            docker load -i /tmp/container-image.tar
          else
            docker pull "${{ matrix.build_container }}"
            docker save "${{ matrix.build_container }}" -o /tmp/container-image.tar
          fi

      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          ref: ci
          path: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout teleport source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Resolve Go version
        id: resolve_go
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
        run: |
          GO_VERSION=$(bash ci/scripts/resolve-go.sh "${{ inputs.tp_version }}" "go/src/${{ env.UPSTREAM }}" ci)
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Go version: ${GO_VERSION}"

      - name: Cache GVM
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: gvm
          key: gvm-${{ steps.resolve_go.outputs.go_version }}-${{ matrix.build_container }}

      - name: Cache Go modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: go/pkg/mod
          key: gomod-${{ inputs.tp_version }}
          restore-keys: gomod-

      - name: Cache Go build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/go-build
          key: gobuild-${{ inputs.tp_version }}-${{ matrix.name }}
          restore-keys: gobuild-${{ inputs.tp_version }}-

      - name: Setup Go (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.resolve_go.outputs.go_version }}
          cache: true
          cache-dependency-path: go/src/${{ env.UPSTREAM }}/go.sum

      - name: Build (ubuntu:14.04)
        if: matrix.build_container == 'ubuntu:14.04'
        uses: docker://ubuntu:14.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:20.04)
        if: matrix.build_container == 'ubuntu:20.04'
        uses: docker://ubuntu:20.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:22.04)
        if: matrix.build_container == 'ubuntu:22.04'
        uses: docker://ubuntu:22.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (macOS native)
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: bash ci/scripts/build.sh

      - name: Smoke test
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
          TP_VERSION: ${{ inputs.tp_version }}
        run: bash ci/scripts/smoke-test.sh

      - name: Package
        env:
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}/dist" || true
          fi
          bash ci/scripts/package.sh "${{ inputs.tp_version }}" "${{ matrix.go_os }}" "${{ matrix.name }}" ci

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ inputs.tp_version }}-${{ matrix.name }}
          path: artifacts/*
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tp_version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  build-extra:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-i386-lite
            go_os: linux
            go_arch: "386"
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-armhf-lite
            go_os: linux
            go_arch: arm
            go_arm: "6"
            go_experiment: ""
            build_container: ubuntu:22.04
            pam: "true"
            cc: arm-linux-gnueabihf-gcc
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-armel-lite
            go_os: linux
            go_arch: arm
            go_arm: "5"
            go_experiment: ""
            build_container: ubuntu:22.04
            pam: "true"
            cc: arm-linux-gnueabi-gcc
            runner: ubuntu-latest
            build_variant: "lite"
          - name: darwin-amd64-lite
            go_os: darwin
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ""
            pam: "false"
            cc: ""
            runner: macos-14
            build_variant: "lite"
          - name: darwin-arm64-lite
            go_os: darwin
            go_arch: arm64
            go_arm: ""
            go_experiment: ""
            build_container: ""
            pam: "false"
            cc: ""
            runner: macos-14
            build_variant: "lite"
          - name: darwin-amd64-upstream
            go_os: darwin
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ""
            pam: "false"
            cc: ""
            runner: macos-14
            build_variant: "upstream"
          - name: darwin-arm64-upstream
            go_os: darwin
            go_arch: arm64
            go_arm: ""
            go_experiment: ""
            build_container: ""
            pam: "false"
            cc: ""
            runner: macos-14
            build_variant: "upstream"
          - name: windows-amd64-lite
            go_os: windows
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ""
            pam: "false"
            cc: ""
            runner: windows-latest
            build_variant: "lite"
    steps:
      - name: Configure Docker Hub mirror
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Cache build container
        if: runner.os == 'Linux' && matrix.build_container != ''
        id: container-cache
        uses: actions/cache@v4
        with:
          path: /tmp/container-image.tar
          key: container-${{ matrix.build_container }}

      - name: Load or pull build container
        if: runner.os == 'Linux' && matrix.build_container != ''
        run: |
          if [[ -f /tmp/container-image.tar ]]; then
            docker load -i /tmp/container-image.tar
          else
            docker pull "${{ matrix.build_container }}"
            docker save "${{ matrix.build_container }}" -o /tmp/container-image.tar
          fi

      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          ref: ci
          path: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout teleport source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Resolve Go version
        id: resolve_go
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
        run: |
          GO_VERSION=$(bash ci/scripts/resolve-go.sh "${{ inputs.tp_version }}" "go/src/${{ env.UPSTREAM }}" ci)
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Go version: ${GO_VERSION}"

      - name: Cache GVM
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: gvm
          key: gvm-${{ steps.resolve_go.outputs.go_version }}-${{ matrix.build_container }}

      - name: Cache Go modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: go/pkg/mod
          key: gomod-${{ inputs.tp_version }}
          restore-keys: gomod-

      - name: Cache Go build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/go-build
          key: gobuild-${{ inputs.tp_version }}-${{ matrix.name }}
          restore-keys: gobuild-${{ inputs.tp_version }}-

      - name: Setup Go (native)
        if: runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.resolve_go.outputs.go_version }}
          cache: true
          cache-dependency-path: go/src/${{ env.UPSTREAM }}/go.sum

      - name: Build (ubuntu:14.04)
        if: matrix.build_container == 'ubuntu:14.04'
        uses: docker://ubuntu:14.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:20.04)
        if: matrix.build_container == 'ubuntu:20.04'
        uses: docker://ubuntu:20.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:22.04)
        if: matrix.build_container == 'ubuntu:22.04'
        uses: docker://ubuntu:22.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (native)
        if: runner.os != 'Linux'
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: bash ci/scripts/build.sh

      - name: Smoke test
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
          TP_VERSION: ${{ inputs.tp_version }}
        run: bash ci/scripts/smoke-test.sh

      - name: Package
        env:
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}/dist" || true
          fi
          bash ci/scripts/package.sh "${{ inputs.tp_version }}" "${{ matrix.go_os }}" "${{ matrix.name }}" ci

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ inputs.tp_version }}-${{ matrix.name }}
          path: artifacts/*
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tp_version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  docker:
    needs: [build-core, build-extra]
    if: always() && (needs.build-core.result == 'success' || needs.build-extra.result == 'success')
    uses: ./.github/workflows/docker.yml
    with:
      tp_version: ${{ inputs.tp_version }}
    secrets: inherit

