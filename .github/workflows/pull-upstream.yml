name: "Pull Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write    # needed for push to ci branch

env:
  REPO_UPSTREAM: https://github.com/gravitational/teleport.git
  AWK_FILTER_TAG: awk -F '/' '/refs\/tags/ && $NF ~ /v[[:digit:]]+(\.[[:digit:]]+){2}$/{print $NF}'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4
        with:
          ref: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Identify upstream branches
        id: upstream
        run: |
          # Release lines for the browsing mirror: major (vN) AND old minor (N.M / vN.M, which
          # never got a major branch upstream and are divergent, so cannot be consolidated).
          # Reject patch-level (12.4.23), suffixed (3.0-g) and non-release (nightly-test).
          # Tags are NOT derived from these branches -- see "Mirror release tags".
          echo "branches=$(git ls-remote --heads ${{ env.REPO_UPSTREAM }} | awk -F '/' '/refs\/heads\/branch/ && $NF ~ /^v?[[:digit:]]+(\.[[:digit:]]+)?$/{print $NF}' | sort -V | tr '\n' ',')" >> $GITHUB_OUTPUT

      - name: Sync upstream branches
        run: |
          git remote add upstream ${{ env.REPO_UPSTREAM }}

          # Browsing/AGPL mirror of each release line. Delta: compare tip SHAs via ls-remote
          # (no fetch) so unchanged lines cost nothing; only lines that moved (CVE backports
          # on the last 2-3 majors) resync. Tags are mirrored separately (next step).
          declare -A fork_sha up_sha
          while read -r sha ref; do fork_sha["${ref#refs/heads/}"]=$sha; done \
            < <(git ls-remote --heads origin)
          while read -r sha ref; do up_sha["${ref##*/}"]=$sha; done \
            < <(git ls-remote --heads upstream 'refs/heads/branch/*')

          for upstream_branch in $(echo "${{ steps.upstream.outputs.branches }}" | tr ',' '\n'); do
            own_branch="source-v${upstream_branch#v}"

            if [ -n "${up_sha[$upstream_branch]}" ] && [ "${up_sha[$upstream_branch]}" = "${fork_sha[$own_branch]}" ]; then
              echo "::notice::${own_branch} up to date (${up_sha[$upstream_branch]:0:12}); skipping"
              continue
            fi

            echo "::group::Updating ${own_branch} (${fork_sha[$own_branch]:0:12} -> ${up_sha[$upstream_branch]:0:12})"
            git fetch --no-tags upstream refs/heads/branch/${upstream_branch}:${own_branch}
            git push origin ${own_branch}
            echo "::endgroup::"
          done

      - name: Mirror release tags
        run: |
          git remote add upstream ${{ env.REPO_UPSTREAM }} 2>/dev/null || true
          # Tags are the build inputs and MUST be mirrored independent of branches: teleport
          # tags many releases on un-merged "release spurs" not reachable from branch/vN, so a
          # branch fetch + push --tags silently misses them (e.g. v18.8.3). Fetch tags directly.
          git fetch --no-tags upstream 'refs/tags/v*:refs/tags/v*'
          # Keep only release tags with major >= 2 (the build universe in VERSIONS);
          # drop pre-releases (-dev/-rc), peeled refs (^{}) and v0/v1.
          git tag -l | awk '!/^v([2-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$/{print}' | xargs -r git tag -d
          git push origin --tags

      - name: Identify LATEST and new versions
        run: |
          git ls-remote --tags ${{ env.REPO_UPSTREAM }} | ${{ env.AWK_FILTER_TAG }} | sort -Vr | sed -n '1p' > LATEST
          # Order-agnostic set difference: repo tags not already in VERSIONS, oldest unbuilt first.
          # (comm requires lexically-sorted input and desyncs on version-sorted lists at major-version rollovers.)
          git ls-remote --tags https://github.com/${{ github.repository }} | ${{ env.AWK_FILTER_TAG }} | sort -Vu \
            | grep -Fxv -f <(grep -v '^#' VERSIONS) | sort -Vu | head -n 1 >> VERSIONS
          if ! git diff-index --quiet HEAD --; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add LATEST VERSIONS
            git commit -m "ci: Bump LATEST($(cat LATEST)) and VERSIONS($(grep -v '^#' VERSIONS | tail -n 1))" || true
            git push origin ci --quiet || true
          fi
