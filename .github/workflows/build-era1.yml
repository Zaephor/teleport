name: "Build Era 1 (v2.0-v2.2)"

on:
  workflow_call:
    inputs:
      tp_version:
        description: "Teleport version tag (e.g. v2.0.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tp_version:
        description: "Teleport version tag (e.g. v2.0.1)"
        required: true
        default: "v2.2.7"

permissions:
  contents: write    # needed for release creation
  packages: write    # needed by docker.yml for GHCR push
  actions: read      # needed for cache

env:
  UPSTREAM: github.com/gravitational/teleport

jobs:
  build-webassets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cache webassets
        id: webassets-cache
        uses: actions/cache@v4
        with:
          path: cached-webassets
          key: webassets-${{ inputs.tp_version }}

      - name: Restore cached webassets
        if: steps.webassets-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p go/src/${{ env.UPSTREAM }}/webassets
          cp -r cached-webassets/* go/src/${{ env.UPSTREAM }}/webassets/

      - name: Checkout CI repo
        if: steps.webassets-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ci
          path: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout teleport source
        if: steps.webassets-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Build web assets
        if: steps.webassets-cache.outputs.cache-hit != 'true'
        uses: docker://ubuntu:22.04
        env:
          REF_PWD: ${{ github.workspace }}
          UPSTREAM: ${{ env.UPSTREAM }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/build-webassets.sh"

      - name: Save webassets to cache path
        if: steps.webassets-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -d "go/src/${{ env.UPSTREAM }}/webassets" ]]; then
            sudo chown -R $(id -u):$(id -g) go/src/${{ env.UPSTREAM }}/webassets/ || true
            mkdir -p cached-webassets
            cp -r go/src/${{ env.UPSTREAM }}/webassets/* cached-webassets/
            echo "Cached webassets: $(du -sh cached-webassets/ | cut -f1)"
          else
            echo "No webassets directory — skipping cache save"
          fi

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: webassets-${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}/webassets/
          retention-days: 1
          if-no-files-found: ignore

  build-core:
    needs: [build-webassets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-lite
            go_os: linux
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-amd64-upstream
            go_os: linux
            go_arch: amd64
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "upstream"

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          ref: ci
          path: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout teleport source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Resolve Go version
        id: resolve_go
        env:
          GO_OS: ${{ matrix.go_os }}
        run: |
          GO_VERSION=$(bash ci/scripts/resolve-go.sh "${{ inputs.tp_version }}" "go/src/${{ env.UPSTREAM }}" ci)
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Go version: ${GO_VERSION}"

      - name: Cache GVM
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: gvm
          key: gvm-${{ steps.resolve_go.outputs.go_version }}-${{ matrix.build_container }}

      - name: Cache Go modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: go/pkg/mod
          key: gomod-${{ inputs.tp_version }}
          restore-keys: gomod-

      - name: Cache Go build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/go-build
          key: gobuild-${{ inputs.tp_version }}-${{ matrix.name }}
          restore-keys: gobuild-${{ inputs.tp_version }}-

      - name: Download web assets
        if: ${{ matrix.build_variant == 'upstream' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: webassets-${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}/webassets

      - name: Build (ubuntu:14.04)
        if: matrix.build_container == 'ubuntu:14.04'
        uses: docker://ubuntu:14.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:20.04)
        if: matrix.build_container == 'ubuntu:20.04'
        uses: docker://ubuntu:20.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:22.04)
        if: matrix.build_container == 'ubuntu:22.04'
        uses: docker://ubuntu:22.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Smoke test
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
          TP_VERSION: ${{ inputs.tp_version }}
        run: bash ci/scripts/smoke-test.sh

      - name: Package
        env:
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}/dist" || true
          fi
          bash ci/scripts/package.sh "${{ inputs.tp_version }}" "${{ matrix.go_os }}" "${{ matrix.name }}" ci

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ inputs.tp_version }}-${{ matrix.name }}
          path: artifacts/*
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tp_version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  build-extra:
    needs: [build-webassets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-i386-lite
            go_os: linux
            go_arch: "386"
            go_arm: ""
            go_experiment: ""
            build_container: ubuntu:14.04
            pam: "true"
            cc: ""
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-armhf-lite
            go_os: linux
            go_arch: arm
            go_arm: "6"
            go_experiment: ""
            build_container: ubuntu:22.04
            pam: "true"
            cc: arm-linux-gnueabihf-gcc
            runner: ubuntu-latest
            build_variant: "lite"
          - name: linux-armel-lite
            go_os: linux
            go_arch: arm
            go_arm: "5"
            go_experiment: ""
            build_container: ubuntu:22.04
            pam: "true"
            cc: arm-linux-gnueabi-gcc
            runner: ubuntu-latest
            build_variant: "lite"

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          ref: ci
          path: ci
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout teleport source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tp_version }}
          path: go/src/${{ env.UPSTREAM }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Resolve Go version
        id: resolve_go
        env:
          GO_OS: ${{ matrix.go_os }}
        run: |
          GO_VERSION=$(bash ci/scripts/resolve-go.sh "${{ inputs.tp_version }}" "go/src/${{ env.UPSTREAM }}" ci)
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Go version: ${GO_VERSION}"

      - name: Cache GVM
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: gvm
          key: gvm-${{ steps.resolve_go.outputs.go_version }}-${{ matrix.build_container }}

      - name: Cache Go modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: go/pkg/mod
          key: gomod-${{ inputs.tp_version }}
          restore-keys: gomod-

      - name: Cache Go build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/go-build
          key: gobuild-${{ inputs.tp_version }}-${{ matrix.name }}
          restore-keys: gobuild-${{ inputs.tp_version }}-

      - name: Build (ubuntu:14.04)
        if: matrix.build_container == 'ubuntu:14.04'
        uses: docker://ubuntu:14.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:20.04)
        if: matrix.build_container == 'ubuntu:20.04'
        uses: docker://ubuntu:20.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Build (ubuntu:22.04)
        if: matrix.build_container == 'ubuntu:22.04'
        uses: docker://ubuntu:22.04
        env:
          CC: ${{ matrix.cc }}
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          GO_ARM: ${{ matrix.go_arm }}
          GO_EXPERIMENT: ${{ matrix.go_experiment }}
          GO_VERSION: ${{ steps.resolve_go.outputs.go_version }}
          REF_NAME: ${{ matrix.name }}
          REF_PWD: ${{ github.workspace }}
          REF_VER: ${{ inputs.tp_version }}
          UPSTREAM: ${{ env.UPSTREAM }}
          PAM: ${{ matrix.pam }}
          GOPATH: ${{ github.workspace }}/go
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          BUILD_VARIANT: ${{ matrix.build_variant }}
        with:
          entrypoint: /bin/bash
          args: >-
            -c "bash ci/scripts/prep.sh && bash ci/scripts/install-go.sh ${GO_VERSION} ${PWD}/gvm && bash ci/scripts/build.sh"

      - name: Smoke test
        env:
          GO_OS: ${{ matrix.go_os }}
          GO_ARCH: ${{ matrix.go_arch }}
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
          TP_VERSION: ${{ inputs.tp_version }}
        run: bash ci/scripts/smoke-test.sh

      - name: Package
        env:
          REF_PWD: ${{ github.workspace }}
          BUILD_VARIANT: ${{ matrix.build_variant }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}/dist" || true
          fi
          bash ci/scripts/package.sh "${{ inputs.tp_version }}" "${{ matrix.go_os }}" "${{ matrix.name }}" ci

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ inputs.tp_version }}-${{ matrix.name }}
          path: artifacts/*
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tp_version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  docker:
    needs: [build-core, build-extra]
    if: always() && (needs.build-core.result == 'success' || needs.build-extra.result == 'success')
    uses: ./.github/workflows/docker.yml
    with:
      tp_version: ${{ inputs.tp_version }}
    secrets: inherit
