name: "%NAME%"
arch: "%ARCH%"
platform: "linux"
version: "%VERSION%"
release: "1"
section: "default"
priority: "optional"
provides:
  - teleport
maintainer: "Zaephor <Zaephor@users.noreply.github.com>"
description: |
  Teleport provides on-demand, least-privileged access to your infrastructure,
  on a foundation of cryptographic identity and zero trust, with built-in
  identity and policy governance. Multi-arch community builds.
vendor: ""
homepage: "https://github.com/Zaephor/teleport"
license: "AGPL-3.0"
scripts:
  postinstall: ./tmp/postinst.sh
  preremove: ./tmp/prerm.sh
rpm:
  scripts:
    posttrans: ./tmp/postinst.sh
contents:
  # Systemd service
  - src: ./systemd-teleport.service
    dst: /opt/teleport/system/lib/systemd/system/teleport.service
    file_info:
      mode: 0644
  # Upstart service (Ubuntu 14.04)
  - src: ./upstart-teleport.conf
    dst: /etc/init/teleport.conf
    file_info:
      mode: 0644
  # Data directory
  - dst: /var/lib/teleport
    type: dir
    file_info:
      mode: 0700
  # Binaries appended dynamically by package.sh
